<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>FloraLux | VIP Member Sign In & Sign Up Portal</title>
  <meta name="description" content="FloraLux VIP Member Sign In and Sign Up Portal. Access saved address vaults, live order tracking, Petal Rewards points, and account settings.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');

    /* --- Global Design Tokens --- */
    :root {
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

      --bg-primary: hsl(35, 30%, 98%);
      --bg-secondary: hsl(35, 20%, 94%);
      --bg-card: #ffffff;
      --text-primary: hsl(210, 25%, 12%);
      --text-secondary: hsl(210, 15%, 35%);
      --text-muted: hsl(210, 10%, 55%);
      
      --primary: hsl(340, 60%, 62%);
      --primary-hover: hsl(340, 55%, 52%);
      --primary-light: hsl(340, 70%, 95%);
      
      --accent: hsl(145, 20%, 42%);
      --accent-hover: hsl(145, 20%, 32%);
      --accent-light: hsl(145, 35%, 94%);
      
      --border: hsl(35, 15%, 88%);
      --border-focus: var(--primary);
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.12);
      
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Theme Variables */
    body.dark {
      --bg-primary: hsl(210, 25%, 7%);
      --bg-secondary: hsl(210, 25%, 11%);
      --bg-card: hsl(210, 25%, 13%);
      --text-primary: hsl(35, 15%, 92%);
      --text-secondary: hsl(210, 10%, 75%);
      --text-muted: hsl(210, 10%, 55%);
      
      --primary: hsl(340, 65%, 72%);
      --primary-hover: hsl(340, 70%, 80%);
      --primary-light: hsla(340, 65%, 72%, 0.15);
      
      --accent: hsl(145, 25%, 58%);
      --accent-hover: hsl(145, 25%, 68%);
      --accent-light: hsla(145, 25%, 58%, 0.15);
      
      --border: hsl(210, 20%, 20%);
      --border-focus: var(--primary);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-primary);
      background-color: var(--bg-primary);
      transition: background-color var(--transition-smooth), color var(--transition-smooth);
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
    }

    /* --- Floating Top-Right Controls --- */
    .top-right-controls {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    [dir="rtl"] .top-right-controls {
      right: auto;
      left: 1.25rem;
    }

    .action-btn, .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: border-color var(--transition-fast), background-color var(--transition-fast), transform var(--transition-fast);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      flex-shrink: 0;
  min-width: 36px;
  min-height: 36px;
  line-height: 1;
}

    .icon-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      color: var(--primary);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* --- FULL PAGE CENTERED CONTAINER --- */
    .login-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    /* Centered Clean Card Layout */
    .login-card {
      max-width: 520px;
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 1.75rem 2.25rem;
      animation: fadeInCard 0.4s ease-out;
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1.65rem;
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
    }

    .brand-logo-link span {
      color: var(--primary);
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      stroke: var(--primary);
    }

    .form-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .auth-tab-row {
      display: flex;
      margin-bottom: 1rem;
      background-color: var(--bg-primary);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
    }

    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.6rem 1rem;
      background: none;
      border: none;
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition-smooth);
    }

    .auth-tab-btn.active {
      color: #fff;
      background-color: var(--primary);
      box-shadow: 0 4px 12px var(--primary-light);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
      position: relative;
    }

    .form-group label {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      background-color: var(--bg-primary);
      border: 1.5px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      width: 100%;
      font-size: 0.925rem;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .form-control:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color var(--transition-fast);
    }

    [dir="rtl"] .password-toggle-btn {
      right: auto;
      left: 0.85rem;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .password-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    /* Password Strength Indicator */
    .strength-wrapper {
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .strength-bar-container {
      height: 4px;
      width: 100%;
      background-color: var(--border);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0;
      border-radius: var(--radius-full);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .strength-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      min-height: 48px;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      touch-action: manipulation;
      width: 100%;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--primary-light);
    }

    .divider-text {
      text-align: center;
      margin: 1.5rem 0 1rem 0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      position: relative;
    }

    .divider-text::before, .divider-text::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background-color: var(--border);
    }

    .divider-text::before { left: 0; }
    .divider-text::after { right: 0; }

    .social-auth-btns {
      display: flex;
      gap: 0.85rem;
    }

    .social-auth-btn {
      flex: 1;
      border: 1.5px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: border-color var(--transition-fast), background-color var(--transition-fast), transform var(--transition-fast);
    }

    .social-auth-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    /* Page Footer Copyright */
    .page-footer-copy {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background-color: var(--accent);
      color: white;
      padding: 0.9rem 1.4rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-weight: 500;
      z-index: 250;
      transform: translateY(100px);
      opacity: 0;
      transition: transform var(--transition-smooth), opacity var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      max-width: calc(100vw - 4rem);
    }

    [dir="rtl"] .toast {
      right: auto;
      left: 2rem;
    }

    /* Mobile-first responsive controls (320px, 480px, 768px, 1024px) */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    @media (max-width: 480px) {
      .login-container { padding: 1.25rem 0.85rem; }
      .login-card { width: 100%; padding: 1.5rem 1.25rem; }
      .social-auth-btns { flex-direction: column; gap: 0.6rem; }
      .social-auth-btn { width: 100%; }
      .top-right-controls { top: 1rem; right: 1rem; gap: 0.4rem; }
    }

    @media (max-width: 320px) {
      .login-card { padding: 1.25rem 1rem; }
      .card-header h2 { font-size: 1.4rem; }
      .btn { padding: 0.65rem; font-size: 0.85rem; }
    }
    /* Mobile Header Compact Fix */
    @media (max-width: 480px) {
      .nav-actions { gap: 0.35rem !important;   flex-wrap: nowrap !important;
}
      .btn#loginBtn, .nav-actions .btn { padding: 0.45rem 0.8rem; font-size: 0.8rem; }
      .icon-btn, .action-btn { width: 32px; height: 32px; min-width: 32px; min-height: 32px; }
    }

  
  /* --- Clean Responsive Header Navigation --- */
  .header-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background-color: var(--navbar-bg, rgba(252, 250, 247, 0.92));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.04));
  }

  .nav-container {
    max-width: var(--max-width, 1200px);
    margin: 0 auto;
    padding: 0 1.25rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo span {
    color: var(--primary);
  }

  /* Desktop Nav Menu */
  .nav-menu {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 1.1rem;
    margin: 0;
    padding: 0;
  }

  .nav-link {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 0.4rem 0.25rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    white-space: nowrap;
    text-decoration: none;
    transition: color var(--transition-fast, 0.2s);
  }

  .nav-link:hover, .nav-link.active {
    color: var(--primary);
  }

  /* Desktop Nav Actions */
  .nav-actions {
    display: flex !important;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
    flex-wrap: nowrap !important;
}

  .action-btn, .icon-btn {
    background: var(--bg-card, #fff);
    border: 1px solid var(--border);
    width: 36px;
    height: 36px;
    min-width: 36px;
    min-height: 36px;
    border-radius: var(--radius-full, 9999px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-primary);
    transition: border-color var(--transition-fast, 0.2s), background-color var(--transition-fast, 0.2s), color var(--transition-fast, 0.2s);
    flex-shrink: 0;
    line-height: 1;
    padding: 0;
    text-decoration: none;
  }

  .action-btn:hover, .icon-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background-color: var(--primary-light, rgba(233, 30, 99, 0.08));
  }

  /* Mobile Toggle - Hidden on Desktop */
  .mobile-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 36px;
    height: 36px;
    background: var(--bg-card, #fff);
    border: 1px solid var(--border);
    border-radius: var(--radius-full, 9999px);
    padding: 9px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .mobile-toggle span {
    height: 2px;
    width: 100%;
    background-color: var(--text-primary);
    border-radius: 2px;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .mobile-toggle.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .mobile-toggle.active span:nth-child(2) {
    opacity: 0;
  }
  .mobile-toggle.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  /* Mobile Responsive Breakpoint (<= 992px) */
  @media (max-width: 992px) {
    .mobile-toggle {
      display: flex !important;
    }

    .nav-menu {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      background-color: var(--bg-card, #fff);
      flex-direction: column;
      align-items: flex-start;
      padding: 1.5rem 1.25rem;
      gap: 1.25rem;
      border-top: 1px solid var(--border);
      transform: translateY(-100%);
      opacity: 0;
      visibility: hidden;
      transition: transform 0.35s ease, opacity 0.35s ease, visibility 0.35s ease;
      overflow-y: auto;
      z-index: 999;
    }

    .nav-menu.active {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .nav-link {
      font-size: 1rem;
      width: 100%;
      padding: 0.5rem 0;
    }
  }

  @media (max-width: 480px) {
    .nav-container { padding: 0 0.85rem; }
    .nav-actions { gap: 0.35rem !important;   flex-wrap: nowrap !important;
}
    .btn#loginBtn, .nav-actions .btn { padding: 0.45rem 0.8rem; font-size: 0.8rem; }
    .icon-btn, .action-btn, .mobile-toggle { width: 32px; height: 32px; min-width: 32px; min-height: 32px; }
  }


    /* --- Master Dark Mode High-Contrast Text Visibility Overrides --- */
    body.dark {
      color: var(--text-primary) !important;
      background-color: var(--bg-primary) !important;
    }

    body.dark h1,
    body.dark h2,
    body.dark h3,
    body.dark h4,
    body.dark h5,
    body.dark h6,
    body.dark .logo,
    body.dark .brand-logo-link,
    body.dark .section-title,
    body.dark .card-title,
    body.dark .hero-content h1,
    body.dark .mobile-drawer-title,
    body.dark .brand-logo-link span:not(.logo-accent) {
      color: var(--text-primary) !important;
    }

    body.dark p,
    body.dark label,
    body.dark li,
    body.dark td,
    body.dark th,
    body.dark .form-subtitle,
    body.dark .section-subtitle,
    body.dark .brand-desc {
      color: var(--text-secondary) !important;
    }

    body.dark a:not(.btn):not(.tag-pill) {
      color: var(--text-primary);
    }

    body.dark .nav-link,
    body.dark .dropdown-link {
      color: var(--text-primary) !important;
    }

    body.dark .nav-link:hover,
    body.dark .dropdown-link:hover {
      color: var(--primary) !important;
      background-color: var(--primary-light) !important;
    }

    body.dark .dropdown,
    body.dark .info-card,
    body.dark .product-card,
    body.dark .bundle-card,
    body.dark .review-card,
    body.dark .deal-day-box,
    body.dark .contact-card,
    body.dark .login-card,
    body.dark .auth-card,
    body.dark .modal-content,
    body.dark .faq-item,
    body.dark .step-card,
    body.dark .harvest-card,
    body.dark .sensory-item,
    body.dark .care-card,
    body.dark .custom-card {
      background-color: var(--bg-card) !important;
      color: var(--text-primary) !important;
      border-color: var(--border) !important;
    }

    body.dark input,
    body.dark textarea,
    body.dark select {
      background-color: var(--bg-secondary) !important;
      color: var(--text-primary) !important;
      border-color: var(--border) !important;
    }

    body.dark input::placeholder,
    body.dark textarea::placeholder {
      color: var(--text-muted) !important;
    }

    body.dark .icon-btn,
    body.dark .action-btn,
    body.dark .mobile-toggle {
      background-color: var(--bg-card) !important;
      color: var(--text-primary) !important;
      border-color: var(--border) !important;
    }

    body.dark .icon-btn:hover,
    body.dark .action-btn:hover {
      border-color: var(--primary) !important;
      color: var(--primary) !important;
      background-color: var(--primary-light) !important;
    }

    body.dark footer {
      background-color: var(--footer-bg) !important;
      color: var(--footer-text) !important;
      border-color: var(--footer-border) !important;
    }

    body.dark footer h4,
    body.dark footer .footer-title {
      color: var(--text-primary) !important;
    }

    body.dark footer a {
      color: var(--text-secondary) !important;
    }

    body.dark footer a:hover {
      color: var(--primary) !important;
    }

  
    /* ==========================================================================
       MASTER FULL-SPECTRUM RESPONSIVE & ACCESSIBILITY FRAMEWORK (320px to 1440px+)
       ========================================================================== */

    /* 1. Global Box Model & Zero Overflow Guarantee */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
    }

    img, video, iframe, svg {
      max-width: 100%;
      height: auto;
    }

    /* 2. Touch Target Ergonomics */
    button, .btn, .icon-btn, .action-btn, a.btn {
      min-height: 40px;
      touch-action: manipulation;
    }

    /* 3. Fluid Responsive Typography Clamp Scale */
    h1, .hero-content h1 {
      font-size: clamp(1.75rem, 4.5vw, 3.5rem) !important;
      line-height: 1.18 !important;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    h2, .section-title, .card-header h2 {
      font-size: clamp(1.45rem, 3.2vw, 2.35rem) !important;
      line-height: 1.25 !important;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    h3, .card-title {
      font-size: clamp(1.15rem, 2.2vw, 1.65rem) !important;
      line-height: 1.3 !important;
      word-wrap: break-word;
    }

    p, body, input, textarea, select, label {
      font-size: clamp(0.875rem, 1.2vw, 1.05rem);
      line-height: 1.6;
    }

    /* 4. Layout Container Scaling */
    .container, .nav-container, .footer-grid {
      width: 100% !important;
      max-width: var(--max-width, 1200px);
      margin-left: auto;
      margin-right: auto;
      padding-left: clamp(0.85rem, 3vw, 1.5rem);
      padding-right: clamp(0.85rem, 3vw, 1.5rem);
    }

    /* 5. Responsive Grid & Breakpoint Adaptations */

    /* --- Mobile (320px - 480px) --- */
    @media (max-width: 480px) {
      .hero-fullscreen, .hero-content {
        padding: 2rem 1rem !important;
        min-height: auto !important;
      }
      .hero-actions {
        flex-direction: column !important;
        width: 100% !important;
        gap: 0.75rem !important;
      }
      .hero-actions .btn, .hero-actions a {
        width: 100% !important;
      }
      .cards-trio, .footer-grid, .grid-split, .grid-split.reversed {
        grid-template-columns: 1fr !important;
        gap: 1.5rem !important;
      }
      .info-card, .product-card, .bundle-card, .review-card, .login-card, .auth-card {
        padding: 1.25rem !important;
        width: 100% !important;
      }
      .nav-actions {
        gap: 0.3rem !important;
        flex-wrap: nowrap !important;
      }
      .btn#loginBtn, .nav-actions .btn {
        padding: 0.45rem 0.75rem !important;
        font-size: 0.8rem !important;
      }
      .icon-btn, .action-btn {
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        min-height: 34px !important;
      }
      form input, form textarea, form select {
        width: 100% !important;
      }
    }

    /* --- Small Tablet / Large Mobile (481px - 768px) --- */
    @media (min-width: 481px) and (max-width: 768px) {
      .cards-trio {
        grid-template-columns: 1fr !important;
        gap: 1.75rem !important;
      }
      .footer-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 2rem !important;
      }
      .grid-split, .grid-split.reversed {
        grid-template-columns: 1fr !important;
        gap: 2rem !important;
      }
    }

    /* --- Tablet (769px - 1024px) --- */
    @media (min-width: 769px) and (max-width: 1024px) {
      .cards-trio {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 1.75rem !important;
      }
      .footer-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 2.25rem !important;
      }
      .grid-split, .grid-split.reversed {
        grid-template-columns: 1fr 1fr !important;
        gap: 2rem !important;
      }
    }

    /* --- Desktop (>= 1025px) --- */
    @media (min-width: 1025px) {
      .mobile-toggle {
        display: none !important;
      }
      .nav-menu {
        display: flex !important;
        position: static !important;
        transform: none !important;
        opacity: 1 !important;
        visibility: visible !important;
        flex-direction: row !important;
        background: transparent !important;
        box-shadow: none !important;
        width: auto !important;
        height: auto !important;
        padding: 0 !important;
      }
    }

  
    /* --- Enhanced Visible Active Navbar Indicators --- */
    .nav-link.active {
      color: var(--primary) !important;
      font-weight: 700 !important;
      position: relative;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--primary);
      border-radius: 9999px;
    }

    .dropdown-link.active {
      background-color: var(--primary-light, rgba(233, 30, 99, 0.12)) !important;
      color: var(--primary) !important;
      font-weight: 700 !important;
    }

    .drawer-link.active {
      background-color: var(--primary-light, rgba(233, 30, 99, 0.12)) !important;
      color: var(--primary) !important;
      font-weight: 700 !important;
      border-left: 4px solid var(--primary) !important;
      padding-left: 0.95rem !important;
    }

    [dir="rtl"] .drawer-link.active {
      border-left: none !important;
      border-right: 4px solid var(--primary) !important;
      padding-right: 0.95rem !important;
    }

  </style>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- --- Top-Right Floating Controls (Dark Mode & RTL Only) --- -->
  <div class="top-right-controls">
    <button class="action-btn icon-btn" id="btn-rtl-toggle" aria-label="Toggle LTR/RTL Layout" title="Switch layout direction">
      <span style="font-size: 14px; font-weight: 700; line-height: 1;">⇄</span>
    </button>
    <button class="icon-btn" id="themeToggle" title="Toggle Theme" aria-label="Toggle light/dark theme">
      <svg id="themeIcon" viewBox="0 0 24 24" style="width:18px; height:18px; fill:currentColor;">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
      </svg>
    </button>
  </div>

  <!-- --- FULL PAGE CENTERED CONTAINER --- -->
  <div class="login-wrapper">

    <div class="login-card">
      
      <!-- FloraLux Brand Logo -->
      <a href="index.html" class="brand-logo-link">
        <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22a8 8 0 0 0 8-8c0-5.5-8-12-8-12S4 8.5 4 14a8 8 0 0 0 8 8z" />
          <path d="M12 6c-2 2-3 4-3 6 0 3 2.5 5 3 5s3-2 3-5c0-2-1-4-3-6z" fill="var(--primary)" fill-opacity="0.25"/>
        </svg>
        Flora<span>Lux</span>
      </a>

      <p class="form-subtitle">VIP Member Sign In & Account Portal</p>

      <!-- Sign In & Sign Up Tabs -->
      <div class="auth-tab-row">
        <button class="auth-tab-btn active" id="tabSignIn">Sign In</button>
        <button class="auth-tab-btn" id="tabRegister">Sign Up</button>
      </div>

      <form id="loginAuthForm">
        <!-- Full Name Field (Sign Up Only) -->
        <div class="form-group" id="fullNameGroup" style="display:none;">
          <label for="regName">Full Name *</label>
          <div class="input-wrapper">
            <input type="text" id="regName" class="form-control" placeholder="Jane Doe">
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="form-group">
          <label for="authEmail">Email Address *</label>
          <div class="input-wrapper">
            <input type="email" id="authEmail" class="form-control" required placeholder="jane@example.com">
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="form-group">
          <label for="authPassword">Password *</label>
          <div class="input-wrapper">
            <input type="password" id="authPassword" class="form-control" required placeholder="••••••••">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Password Strength Meter (Sign Up Only) -->
        <div class="strength-wrapper" id="strengthWrapper">
          <div class="strength-text">
            <span>Password strength:</span>
            <strong id="strengthText">Weak</strong>
          </div>
          <div class="strength-bar-container">
            <div class="strength-bar-fill" id="strengthBar"></div>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.4rem; font-size:0.825rem;">
          <label style="display:flex; align-items:center; gap:0.45rem; cursor:pointer; user-select:none;">
            <input type="checkbox" id="rememberMe" checked style="accent-color: var(--primary); width:15px; height:15px;"> Remember Me
          </label>
          <a href="#" id="forgotPasswordBtn" style="color:var(--primary); font-weight:600; text-decoration:none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn" id="authSubmitBtn">Sign In to Account</button>
      </form>

      <div class="divider-text">OR CONTINUE WITH</div>

      <!-- Social Auth Buttons with SVGs -->
      <div class="social-auth-btns">
        <button class="social-auth-btn" id="googleAuthBtn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>
        <button class="social-auth-btn" id="appleAuthBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.1-.97.04-2.17.65-2.86 1.45-.61.71-1.15 1.87-.99 3 1.09.08 2.21-.54 2.86-1.35z"/></svg>
          Apple ID
        </button>
      </div>

    </div>

    <div class="page-footer-copy">
      &copy; 2026 FloraLux Luxury Floristry. All rights reserved.
    </div>

  </div>

  <!-- Toast Notification Container -->
  <div class="toast" id="toastNotification">
    <span class="toast-icon">✔</span>
    <span class="toast-message" id="toastMessage">Success</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {



      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      let toastTimeout;

      function showToast(message, isError = false) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toastMsg.textContent = message;
        if (isError) {
          toast.style.backgroundColor = 'var(--primary)';
          toast.querySelector('.toast-icon').textContent = '⚠';
        } else {
          toast.style.backgroundColor = 'var(--accent)';
          toast.querySelector('.toast-icon').textContent = '✔';
        }
        toast.classList.add('active');
        toastTimeout = setTimeout(() => {
          toast.classList.remove('active');
        }, 3200);
      }

      // Tab Swaps (Sign In / Sign Up)
      const tabSignIn = document.getElementById('tabSignIn');
      const tabRegister = document.getElementById('tabRegister');
      const fullNameGroup = document.getElementById('fullNameGroup');
      const authSubmitBtn = document.getElementById('authSubmitBtn');
      const strengthWrapper = document.getElementById('strengthWrapper');
      const regNameInput = document.getElementById('regName');
      let isRegister = false;

      tabSignIn.addEventListener('click', () => {
        isRegister = false;
        tabSignIn.classList.add('active');
        tabRegister.classList.remove('active');
        fullNameGroup.style.display = 'none';
        strengthWrapper.style.display = 'none';
        regNameInput.removeAttribute('required');
        authSubmitBtn.textContent = 'Sign In to Account';
      });

      tabRegister.addEventListener('click', () => {
        isRegister = true;
        tabRegister.classList.add('active');
        tabSignIn.classList.remove('active');
        fullNameGroup.style.display = 'flex';
        strengthWrapper.style.display = 'block';
        regNameInput.setAttribute('required', 'true');
        authSubmitBtn.textContent = 'Sign Up for VIP Account';
      });

      // Password Visibility Eye Toggle
      const authPasswordInput = document.getElementById('authPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      const openEyePath = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      const closedEyePath = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = authPasswordInput.getAttribute('type') === 'password';
        if (isPassword) {
          authPasswordInput.setAttribute('type', 'text');
          eyeIcon.innerHTML = closedEyePath;
        } else {
          authPasswordInput.setAttribute('type', 'password');
          eyeIcon.innerHTML = openEyePath;
        }
      });

      // Real-time Password Strength Meter
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');

      authPasswordInput.addEventListener('input', () => {
        if (!isRegister) return;
        const val = authPasswordInput.value;
        let score = 0;
        if (val.length >= 6) score += 25;
        if (val.length >= 10) score += 25;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

        strengthBar.style.width = score + '%';

        if (score <= 25) {
          strengthBar.style.backgroundColor = '#e74c3c';
          strengthText.textContent = 'Weak';
          strengthText.style.color = '#e74c3c';
        } else if (score <= 50) {
          strengthBar.style.backgroundColor = '#e67e22';
          strengthText.textContent = 'Moderate';
          strengthText.style.color = '#e67e22';
        } else if (score <= 75) {
          strengthBar.style.backgroundColor = '#f1c40f';
          strengthText.textContent = 'Good';
          strengthText.style.color = '#f1c40f';
        } else {
          strengthBar.style.backgroundColor = '#2ecc71';
          strengthText.textContent = 'Strong';
          strengthText.style.color = '#2ecc71';
        }
      });

      // Auth Form Submit Handler (Active Authentication & Session Redirect)
      const loginAuthForm = document.getElementById('loginAuthForm');
      loginAuthForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        authSubmitBtn.disabled = true;
        
        let userName = 'VIP Member';
        if (isRegister) {
          userName = document.getElementById('regName').value || 'VIP Member';
        } else {
          userName = email.split('@')[0] || 'VIP Member';
        }

        const userSession = {
          email: email,
          name: userName,
          isLoggedIn: true,
          activatedAt: new Date().toISOString()
        };
        localStorage.setItem('floraLuxUser', JSON.stringify(userSession));

        authSubmitBtn.textContent = isRegister ? 'Activating VIP Account...' : 'Signing In...';
        showToast(isRegister ? `Account activated! Welcome, ${userName}.` : `Welcome back, ${userName}!`);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      });

      // Forgot Password Handler
      document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        if (email) {
          showToast(`Password reset link sent to ${email}`);
        } else {
          showToast('Please enter your email address to reset password.', true);
        }
      });

      // Social Auth Handlers (Active SSO Simulation)
      const triggerSocialAuth = (providerName) => {
        const ssoSession = {
          email: `vip.${providerName.toLowerCase()}@floralux.com`,
          name: `${providerName} VIP Member`,
          isLoggedIn: true,
          activatedAt: new Date().toISOString()
        };
        localStorage.setItem('floraLuxUser', JSON.stringify(ssoSession));
        showToast(`Connected via ${providerName}! Redirecting...`);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      };

      document.getElementById('googleAuthBtn').addEventListener('click', () => {
        triggerSocialAuth('Google');
      });

      document.getElementById('appleAuthBtn').addEventListener('click', () => {
        triggerSocialAuth('Apple ID');
      });

      // Dark Theme Toggle
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      
      const moonPath = 'M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z';
      const sunPath = 'M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z';

      function applyTheme(isDark) {
        if (isDark) {
          document.body.classList.add('dark');
          themeIcon.innerHTML = `<path d="${sunPath}" />`;
          localStorage.setItem('theme', 'dark');
        } else {
          document.body.classList.remove('dark');
          themeIcon.innerHTML = `<path d="${moonPath}" />`;
          localStorage.setItem('theme', 'light');
        }
      }

      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

      themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        applyTheme(!isDark);
      });

      // RTL Direction Toggle
      const rtlToggle = (document.getElementById('btn-rtl-toggle') || document.getElementById('rtlToggle'));
      rtlToggle.addEventListener('click', () => {
        const currentDir = document.documentElement.getAttribute('dir');
        if (currentDir === 'rtl') {
          document.documentElement.setAttribute('dir', 'ltr');
          document.documentElement.setAttribute('lang', 'en');
        } else {
          document.documentElement.setAttribute('dir', 'rtl');
          document.documentElement.setAttribute('lang', 'ar');
        }
      });

    });
  </script>
</body>
</html>
